<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>힘의 표현: 컬링게임</title>
  <style>
    :root{--ink:#14213d;--paper:#f4f0e6;--lime:#d9ff4f;--orange:#ff6b35;--white:#fffdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:linear-gradient(#14213d0b 1px,transparent 1px),linear-gradient(90deg,#14213d0b 1px,transparent 1px),var(--paper);background-size:24px 24px}
    button,input{font:inherit}.page{width:min(1320px,100%);margin:auto;padding:26px clamp(12px,4vw,52px) 36px}
    header{display:flex;align-items:end;justify-content:space-between;padding-bottom:16px;border-bottom:3px solid var(--ink)}
    .kicker{margin:0 0 3px;font-size:11px;font-weight:900;letter-spacing:.22em;color:#5d6880}h1{margin:0;font-size:clamp(38px,6vw,72px);line-height:.94;letter-spacing:-.075em}
    .score{display:flex;overflow:hidden;color:#fff;background:var(--ink);border-radius:16px 16px 4px 16px;box-shadow:6px 6px 0 var(--lime)}
    .score div{min-width:90px;padding:10px 16px;border-right:1px solid #ffffff30}.score div:last-child{border:0}.score span{display:block;font-size:10px;letter-spacing:.12em;opacity:.65}.score strong{font-size:26px}.score em{font-size:12px;font-style:normal;opacity:.5}
    .shell{margin-top:18px;border:2px solid var(--ink);background:var(--white);box-shadow:9px 9px 0 var(--ink)}
    .lesson{display:flex;gap:23px;align-items:center;min-height:50px;padding:10px 16px;border-bottom:2px solid var(--ink);font-size:13px;font-weight:800}.lesson p{margin:0}.lesson p:last-child{margin-left:auto;color:#5d6880}.lesson b{color:var(--ink)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 255px}.stage{padding:16px;min-width:0}.canvas-wrap{position:relative;border:2px solid var(--ink);background:#deebff;overflow:hidden}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;cursor:crosshair}
    .message{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(92%,620px);padding:9px 13px;text-align:center;font-size:13px;font-weight:800;background:#fffdf8ef;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);pointer-events:none}
    aside{display:flex;flex-direction:column;gap:18px;padding:17px;border-left:2px solid var(--ink);background:#f6f2e9}.readout{padding-bottom:16px;border-bottom:2px solid var(--ink)}.label,legend{font-size:11px;font-weight:900;letter-spacing:.12em;color:#5d6880}
    #force{display:block;font-size:56px;line-height:1;letter-spacing:-.07em}#force small{font-size:16px;letter-spacing:0}.meter{height:8px;margin:9px 0 13px;background:#fff;border:1.5px solid var(--ink)}.meter i{display:block;height:100%;width:0;background:var(--orange)}
    dl{margin:0}dl div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #14213d30;font-size:13px}dt{color:#68738a}dd{margin:0;font-weight:900}
    fieldset{margin:0;padding:0;border:0}legend{margin-bottom:6px}.surface{display:flex;align-items:center;gap:8px;padding:8px;border:1.5px solid transparent;cursor:pointer}.surface:has(input:checked){background:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}.surface span{display:flex;flex-direction:column}.surface b{font-size:13px}.surface small{color:#6a7488}
    .actions{display:grid;gap:9px;margin-top:auto}.actions button{min-height:43px;border:2px solid var(--ink);font-weight:900;cursor:pointer}.next{display:none;background:var(--lime);box-shadow:4px 4px 0 var(--ink)}.reset{background:transparent}.result{display:none;padding:12px;border:2px solid var(--ink);background:var(--lime)}.result span{display:block;font-size:11px;font-weight:900}.result strong{font-size:34px}.result em{font-size:12px;font-style:normal;opacity:.55}
    footer{display:flex;justify-content:space-between;gap:15px;padding-top:25px;font-size:13px}footer p{margin:0}footer b{padding:3px 6px;margin-right:6px;background:var(--lime)}footer span{color:#68738a;font-weight:700}
    @media(max-width:820px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;border-left:0;border-top:2px solid var(--ink)}.actions{margin-top:0}.lesson{flex-wrap:wrap;gap:8px 16px}.lesson p:last-child{width:100%;margin-left:0}}
    @media(max-width:560px){.page{padding:16px 10px 28px}.score div{min-width:64px;padding:8px 10px}.score strong{font-size:21px}.stage{padding:8px}aside{grid-template-columns:1fr}.lesson{font-size:12px}footer{flex-direction:column}.shell{box-shadow:6px 6px 0 var(--ink)}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div><p class="kicker">FORCE LAB · 01</p><h1>힘의 표현: 컬링게임</h1></div>
      <div class="score" aria-label="점수판"><div><span>시도</span><strong id="round">0<em>/5</em></strong></div><div><span>점수</span><strong id="score">0</strong></div></div>
    </header>
    <section class="shell">
      <div class="lesson"><p>● 화살표 방향 = 힘의 방향</p><p>→ 화살표 길이 = 힘의 크기</p><p>모든 힘은 <b>0.20초</b> 동안 작용합니다.</p></div>
      <div class="layout">
        <div class="stage"><div class="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="원반에서 목표 방향으로 드래그하는 힘 게임"></canvas>
          <div class="message" id="message" aria-live="polite">원반에서 목표 쪽으로 드래그하세요.</div>
        </div></div>
        <aside>
          <div class="readout"><span class="label">가할 힘</span><strong id="force">0<small> N</small></strong><div class="meter"><i id="meter"></i></div><dl><div><dt>방향각</dt><dd id="angle">—</dd></div><div><dt>작용 시간</dt><dd>0.20 s</dd></div></dl></div>
          <div class="actions"><div class="result" id="result"><span>최종 점수</span><strong><i id="final">0</i><em>/500</em></strong></div><button class="next" id="next">다음 시도</button><button class="reset" id="reset">처음부터</button></div>
        </aside>
      </div>
    </section>
    <footer><p><b>생각해 보기</b>같은 힘을 다른 바닥에서 가하면 왜 이동 거리가 달라질까요?</p></footer>
  </div>
  <script>
    (() => {
      const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d");
      const W=960,H=540,start={x:170,y:410},target={x:730,y:155},maxDrag=190;
      const FRICTION=46;
      const ui={round:document.querySelector("#round"),score:document.querySelector("#score"),force:document.querySelector("#force"),meter:document.querySelector("#meter"),angle:document.querySelector("#angle"),message:document.querySelector("#message"),next:document.querySelector("#next"),reset:document.querySelector("#reset"),result:document.querySelector("#result"),final:document.querySelector("#final")};
      let puck={...start},velocity={x:0,y:0},aim=null,dragging=false,moving=false,shots=[],last=0;
      const length=v=>Math.hypot(v.x,v.y),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
      const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
      function scoreAt(p){const d=dist(p,target);return d<=34?100:d<=68?70:d<=108?40:0}
      function setMessage(text){ui.message.textContent=text}
      function updateReadout(){
        const n=aim?Math.min(maxDrag,length(aim)):0,f=Math.round(n/maxDrag*60);
        ui.force.innerHTML=f+"<small> N</small>";ui.meter.style.width=(f/60*100)+"%";ui.angle.textContent=aim?Math.round(Math.atan2(-aim.y,aim.x)*180/Math.PI)+"°":"—";
        ui.round.innerHTML=shots.length+"<em>/5</em>";const total=shots.reduce((s,x)=>s+x.score,0);ui.score.textContent=total;ui.final.textContent=total;
      }
      function drawArrow(){
        if(!aim||length(aim)<2)return;const n=Math.min(maxDrag,length(aim)),ux=aim.x/length(aim),uy=aim.y/length(aim),ex=puck.x+ux*n,ey=puck.y+uy*n;
        ctx.save();ctx.strokeStyle="#ff6b35";ctx.fillStyle="#ff6b35";ctx.lineWidth=6;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(puck.x,puck.y);ctx.lineTo(ex,ey);ctx.stroke();
        const a=Math.atan2(uy,ux);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-22*Math.cos(a-.52),ey-22*Math.sin(a-.52));ctx.lineTo(ex-22*Math.cos(a+.52),ey-22*Math.sin(a+.52));ctx.closePath();ctx.fill();
        ctx.fillStyle="#14213d";ctx.font="900 15px system-ui";ctx.fillText(Math.round(n/maxDrag*60)+" N",ex-12,ey-18);ctx.restore();
      }
      function draw(){
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle="#deebff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#ffffffaa";ctx.lineWidth=3;for(let x=-200;x<W;x+=180){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+330,H);ctx.stroke()}
        ctx.strokeStyle="#14213d18";ctx.lineWidth=1;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=43){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
        [["#fff",108],["#ffad96",76],["#fff",47],["#ff6b35",19]].forEach(([c,r])=>{ctx.fillStyle=c;ctx.strokeStyle="#14213d";ctx.lineWidth=2;ctx.beginPath();ctx.arc(target.x,target.y,r,0,Math.PI*2);ctx.fill();ctx.stroke()});
        ctx.fillStyle="#14213d";ctx.font="900 13px system-ui";ctx.textAlign="center";ctx.fillText("GOAL",target.x,target.y-124);ctx.fillText("START",start.x,start.y+41);
        shots.forEach((s,i)=>{ctx.fillStyle="#fff";ctx.strokeStyle="#14213d";ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#14213d";ctx.font="900 12px system-ui";ctx.fillText(i+1,s.x,s.y+4)});
        drawArrow();ctx.fillStyle="#d9ff4f";ctx.strokeStyle="#14213d";ctx.lineWidth=3;ctx.beginPath();ctx.arc(puck.x,puck.y,18,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle="#14213d";ctx.beginPath();ctx.arc(puck.x,puck.y,7,0,Math.PI*2);ctx.fill();ctx.textAlign="start";
      }
      function finish(){
        moving=false;velocity={x:0,y:0};const s=scoreAt(puck);shots.push({...puck,score:s});
        if(s===100)setMessage("정중앙! 힘의 크기와 방향이 모두 정확했어요.");
        else if(s>0)setMessage("목표 구역 도착! 이전 기록과 비교해 보세요.");
        else if(puck.x>target.x+90)setMessage("너무 멀리 갔어요. 다음에는 힘을 줄여 보세요.");
        else if(puck.x<target.x-90)setMessage("힘이 부족했거나 방향이 왼쪽으로 치우쳤어요.");
        else setMessage("방향을 조금 고쳐 보세요. 이전 착지점과 비교해 볼까요?");
        ui.next.style.display=shots.length<5?"block":"none";ui.result.style.display=shots.length===5?"block":"none";updateReadout();draw();
      }
      function frame(t){
        if(!moving)return;const dt=Math.min((t-last)/1000,.032);last=t;let speed=length(velocity);
        if(speed<2){finish();return}puck.x+=velocity.x*dt;puck.y+=velocity.y*dt;
        let bounced=false;
        if(puck.x<18||puck.x>W-18){puck.x=Math.max(18,Math.min(W-18,puck.x));velocity.x*=-1;bounced=true}
        if(puck.y<18||puck.y>H-18){puck.y=Math.max(18,Math.min(H-18,puck.y));velocity.y*=-1;bounced=true}
        if(bounced){velocity.x*=.82;velocity.y*=.82;setMessage("벽에 부딪혀 반사되었습니다.")}
        speed=length(velocity);const ns=Math.max(0,speed-FRICTION*dt),ratio=ns/speed;velocity.x*=ratio;velocity.y*=ratio;draw();requestAnimationFrame(frame);
      }
      canvas.addEventListener("pointerdown",e=>{if(moving||shots.length>=5||dist(point(e),puck)>35)return;canvas.setPointerCapture(e.pointerId);dragging=true;aim={x:0,y:0};setMessage("화살표의 길이와 방향을 확인하고 손을 놓으세요.");draw()});
      canvas.addEventListener("pointermove",e=>{if(!dragging)return;const p=point(e),raw={x:p.x-puck.x,y:p.y-puck.y},n=length(raw),k=n>maxDrag?maxDrag/n:1;aim={x:raw.x*k,y:raw.y*k};updateReadout();draw()});
      canvas.addEventListener("pointerup",()=>{
        if(!dragging)return;dragging=false;const n=aim?length(aim):0;if(n<16){aim=null;setMessage("조금 더 길게 드래그해 보세요.");updateReadout();draw();return}
        const speed=n*2.55;velocity={x:aim.x/n*speed,y:aim.y/n*speed};aim=null;moving=true;last=performance.now();setMessage("힘은 끝났고, 이제 원반이 마찰을 받으며 움직입니다.");updateReadout();requestAnimationFrame(frame)
      });
      ui.next.addEventListener("click",()=>{puck={...start};aim=null;ui.next.style.display="none";setMessage((shots.length+1)+"번째 기록을 보고 힘을 조절해 보세요.");draw()});
      ui.reset.addEventListener("click",()=>{puck={...start};velocity={x:0,y:0};aim=null;dragging=false;moving=false;shots=[];ui.next.style.display="none";ui.result.style.display="none";setMessage("원반에서 목표 쪽으로 드래그하세요.");updateReadout();draw()});
      updateReadout();draw();
    })();
  </script>
</body>
</html>
